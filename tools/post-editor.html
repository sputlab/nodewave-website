<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>NodeWave post editor</title>
<style>
:root{--bg:#fafafa;--panel:#fff;--text:#1c1c1e;--mut:#6b6b70;--line:#d9d9de;--acc:#1a7f37;--danger:#c62828}
@media(prefers-color-scheme:dark){:root{--bg:#141416;--panel:#1d1d20;--text:#ececef;--mut:#9a9aa1;--line:#34343a;--acc:#4cc46b;--danger:#ef6a6a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}
header{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:5}
header h1{font-size:16px;margin:0 auto 0 0}
button,select,input,textarea{font:inherit;color:inherit}
button{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px 12px;cursor:pointer}
button:hover{border-color:var(--acc)}
button.pri{background:var(--acc);border-color:var(--acc);color:#fff}
button.del{color:var(--danger)}
button.sm{padding:2px 8px;font-size:13px}
input,textarea,select{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:6px 8px}
textarea{resize:vertical;min-height:70px}
.layout{display:grid;grid-template-columns:260px 1fr 1fr;gap:16px;padding:16px;align-items:start}
@media(max-width:1100px){.layout{grid-template-columns:240px 1fr}.preview{grid-column:1/-1}}
@media(max-width:700px){.layout{grid-template-columns:1fr}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px}
.plist{list-style:none;margin:0;padding:0}
.plist li{padding:8px;border-radius:6px;cursor:pointer;border:1px solid transparent}
.plist li:hover{border-color:var(--line)}
.plist li.on{border-color:var(--acc)}
.plist small{display:block;color:var(--mut)}
label{display:block;font-size:13px;color:var(--mut);margin:8px 0 3px}
.row{display:grid;grid-template-columns:1fr 150px;gap:10px}
.blk{border:1px solid var(--line);border-radius:8px;padding:8px;margin:10px 0}
.bh{display:flex;gap:6px;align-items:center;margin-bottom:6px;color:var(--mut);font-size:13px}
.bh b{margin-right:auto;text-transform:uppercase;letter-spacing:.05em}
.add{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.hint{color:var(--mut);font-size:13px}
.msg{color:var(--acc);font-size:13px}
.err{color:var(--danger);font-size:13px}
.preview h2{margin-top:0}.preview figure{margin:12px 0}.preview figcaption{color:var(--mut);font-size:13px}
.preview img{max-width:100%;height:auto}
.preview a{color:var(--acc)}
</style>
</head>
<body>
<header>
  <h1>NodeWave post editor</h1>
  <span id="status" class="msg"></span>
  <input type="file" id="file" accept=".json,application/json" hidden>
  <button id="open">Open posts.json…</button>
  <button id="copy">Copy JSON</button>
  <button id="dl" class="pri">Download posts.json</button>
</header>

<div class="layout">
  <aside class="panel">
    <button id="new" class="pri" style="width:100%">+ New post</button>
    <ul class="plist" id="plist"></ul>
    <p class="hint">Open your current <code>posts.json</code> first, edit, then download and replace the file in the site folder. Work is also kept in this browser automatically.</p>
  </aside>

  <section class="panel" id="editor"></section>

  <section class="panel preview" id="preview"></section>
</div>

<script>
(function () {
  var KEY = 'nodewave-post-editor', data = { posts: [] }, cur = -1;
  var $ = function (id) { return document.getElementById(id); };
  function esc(s) { var d = document.createElement('div'); d.textContent = s == null ? '' : s; return d.innerHTML; }
  function safeUrl(u) { return /^(https?:|mailto:|[\w./#?=&%-]+$)/i.test(u) ? u : '#'; }
  // same rendering rules as blog.html
  function inline(t) {
    var out = '', re = /\[([^\]]+)\]\(([^)\s]+)\)/g, last = 0, m;
    function fmt(x) { return esc(x).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>').replace(/\*(.+?)\*/g, '<em>$1</em>'); }
    while ((m = re.exec(t))) { out += fmt(t.slice(last, m.index)) + '<a href="' + esc(safeUrl(m[2])) + '">' + esc(m[1]) + '</a>'; last = re.lastIndex; }
    return out + fmt(t.slice(last));
  }
  function blockHtml(b) {
    if (typeof b === 'string') return '<p>' + inline(b) + '</p>';
    if (b.img) return '<figure><img src="../' + esc(safeUrl(b.img)) + '" alt="' + esc(b.alt || '') + '">' + (b.caption ? '<figcaption>' + inline(b.caption) + '</figcaption>' : '') + '</figure>';
    if (b.heading != null) return '<h3>' + esc(b.heading) + '</h3>';
    if (b.list) return '<ul>' + b.list.map(function (i) { return '<li>' + inline(i) + '</li>'; }).join('') + '</ul>';
    return '';
  }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(data)); } catch (e) {} }
  function flash(t, bad) { var s = $('status'); s.className = bad ? 'err' : 'msg'; s.textContent = t; setTimeout(function () { s.textContent = ''; }, 3000); }
  function slug(t) { return t.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 50); }
  function today() { var d = new Date(); return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2); }
  function btype(b) { return typeof b === 'string' ? 'paragraph' : b.img != null ? 'image' : b.list ? 'list' : 'heading'; }

  function renderList() {
    var order = data.posts.map(function (p, i) { return i; }).sort(function (a, b) { var x = data.posts[a].date, y = data.posts[b].date; return x < y ? 1 : x > y ? -1 : b - a; });
    $('plist').innerHTML = order.map(function (i) {
      var p = data.posts[i];
      return '<li data-i="' + i + '" class="' + (i === cur ? 'on' : '') + '"><strong>' + esc(p.title || '(untitled)') + '</strong><small>' + esc(p.date) + '</small></li>';
    }).join('') || '<li class="hint">No posts yet.</li>';
  }
  function renderPreview() {
    var p = data.posts[cur];
    $('preview').innerHTML = p ? '<h2>' + esc(p.title) + '</h2><p class="hint">' + esc(p.date) + '</p>' + p.body.map(blockHtml).join('') : '<p class="hint">Preview</p>';
  }
  function renderEditor() {
    var p = data.posts[cur], el = $('editor');
    if (!p) { el.innerHTML = '<p class="hint">Select a post or create a new one.</p>'; renderPreview(); return; }
    var h = '<div class="row"><div><label>Title</label><input data-f="title" value="' + esc(p.title) + '"></div><div><label>Date</label><input type="date" data-f="date" value="' + esc(p.date) + '"></div></div>' +
      '<label>ID (used in the link blog.html#id)</label><input data-f="id" value="' + esc(p.id) + '">' +
      '<div id="iderr" class="err"></div><label>Body</label>';
    p.body.forEach(function (b, i) {
      var t = btype(b), inner;
      if (t === 'paragraph') inner = '<textarea data-i="' + i + '" data-k="text">' + esc(b) + '</textarea>';
      else if (t === 'heading') inner = '<input data-i="' + i + '" data-k="heading" value="' + esc(b.heading) + '">';
      else if (t === 'list') inner = '<textarea data-i="' + i + '" data-k="list" placeholder="One item per line">' + esc(b.list.join('\n')) + '</textarea>';
      else inner = '<input data-i="' + i + '" data-k="img" placeholder="assets/screens/map.png" value="' + esc(b.img) + '"><input data-i="' + i + '" data-k="alt" placeholder="Alt text" value="' + esc(b.alt || '') + '" style="margin-top:6px"><input data-i="' + i + '" data-k="caption" placeholder="Caption (optional)" value="' + esc(b.caption || '') + '" style="margin-top:6px">';
      h += '<div class="blk"><div class="bh"><b>' + t + '</b>' +
        '<button class="sm" data-act="up" data-i="' + i + '">↑</button><button class="sm" data-act="down" data-i="' + i + '">↓</button><button class="sm del" data-act="rm" data-i="' + i + '">Delete</button></div>' + inner + '</div>';
    });
    h += '<div class="add"><button data-add="paragraph">+ Paragraph</button><button data-add="heading">+ Heading</button><button data-add="list">+ List</button><button data-add="image">+ Image</button></div>' +
      '<p class="hint">In text: [label](url) for links, **bold**, *italic*.</p><hr style="border:0;border-top:1px solid var(--line)"><button class="del" data-act="delpost">Delete this post</button>';
    el.innerHTML = h;
    renderPreview();
  }

  $('editor').addEventListener('input', function (e) {
    var t = e.target, p = data.posts[cur]; if (!p) return;
    if (t.dataset.f) {
      p[t.dataset.f] = t.value;
      if (t.dataset.f === 'id' || t.dataset.f === 'title') {
        var dup = data.posts.some(function (q, i) { return i !== cur && q.id === p.id; });
        $('iderr').textContent = !p.id ? 'ID is required.' : dup ? 'Another post already uses this ID.' : '';
      }
    } else if (t.dataset.i != null) {
      var i = +t.dataset.i, k = t.dataset.k, b = p.body[i];
      if (k === 'text') p.body[i] = t.value;
      else if (k === 'list') b.list = t.value.split('\n').map(function (s) { return s.trim(); }).filter(Boolean);
      else if (k === 'heading') b.heading = t.value;
      else if (t.value || k === 'img') b[k] = t.value; else delete b[k];
    }
    save(); renderPreview(); renderList();
  });
  $('editor').addEventListener('click', function (e) {
    var t = e.target.closest('button'); if (!t) return;
    var p = data.posts[cur], i = +t.dataset.i;
    if (t.dataset.add) {
      p.body.push({ paragraph: '', heading: { heading: '' }, list: { list: [] }, image: { img: '', alt: '' } }[t.dataset.add]);
      if (t.dataset.add === 'paragraph') p.body[p.body.length - 1] = '';
    } else if (t.dataset.act === 'rm') p.body.splice(i, 1);
    else if (t.dataset.act === 'up' && i > 0) p.body.splice(i - 1, 0, p.body.splice(i, 1)[0]);
    else if (t.dataset.act === 'down' && i < p.body.length - 1) p.body.splice(i + 1, 0, p.body.splice(i, 1)[0]);
    else if (t.dataset.act === 'delpost') { if (!confirm('Delete this post?')) return; data.posts.splice(cur, 1); cur = -1; }
    else return;
    save(); renderList(); renderEditor();
  });
  $('plist').addEventListener('click', function (e) {
    var li = e.target.closest('li[data-i]'); if (!li) return;
    cur = +li.dataset.i; renderList(); renderEditor();
  });
  $('new').addEventListener('click', function () {
    data.posts.push({ id: 'new-post-' + Date.now().toString(36), date: today(), title: 'New post', body: [''] });
    cur = data.posts.length - 1; save(); renderList(); renderEditor();
  });

  function problems() {
    var ids = {}, out = [];
    data.posts.forEach(function (p) {
      if (!p.id) out.push('A post has no ID.'); else if (ids[p.id]) out.push('Duplicate ID: ' + p.id); ids[p.id] = 1;
      if (!/^\d{4}-\d{2}-\d{2}$/.test(p.date || '')) out.push('Bad date in "' + p.title + '".');
      if (!p.title) out.push('A post has no title.');
    });
    return out;
  }
  function json() {
    var clean = { posts: data.posts.map(function (p) { return { id: p.id, date: p.date, title: p.title, body: p.body.filter(function (b) { return typeof b === 'string' ? b.trim() : true; }) }; }) };
    return JSON.stringify(clean, null, 2) + '\n';
  }
  $('dl').addEventListener('click', function () {
    var pr = problems(); if (pr.length) { flash(pr[0], true); return; }
    var a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([json()], { type: 'application/json' })); a.download = 'posts.json';
    document.body.appendChild(a); a.click(); a.remove(); flash('Downloaded. Replace posts.json in the site folder.');
  });
  $('copy').addEventListener('click', function () {
    var pr = problems(); if (pr.length) { flash(pr[0], true); return; }
    (navigator.clipboard ? navigator.clipboard.writeText(json()) : Promise.reject()).then(function () { flash('JSON copied.'); }, function () { flash('Copy not available, use Download.', true); });
  });
  $('open').addEventListener('click', function () { $('file').click(); });
  $('file').addEventListener('change', function () {
    var f = this.files[0]; if (!f) return;
    var r = new FileReader();
    r.onload = function () {
      try {
        var d = JSON.parse(r.result);
        if (!d || !Array.isArray(d.posts)) throw 0;
        if (data.posts.length && !confirm('Replace the posts currently in the editor with this file?')) return;
        data = d; cur = -1; save(); renderList(); renderEditor(); flash('Loaded ' + d.posts.length + ' posts.');
      } catch (e) { flash('This is not a valid posts.json.', true); }
    };
    r.readAsText(f); this.value = '';
  });

  try { var s = JSON.parse(localStorage.getItem(KEY)); if (s && Array.isArray(s.posts)) data = s; } catch (e) {}
  renderList(); renderEditor();
})();
</script>
</body>
</html>
