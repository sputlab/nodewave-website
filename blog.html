<script>
(function () {
  var box = document.getElementById('posts'), bq = document.getElementById('bq'), posts = [];
  function esc(s) { var d = document.createElement('div'); d.textContent = s == null ? '' : s; return d.innerHTML; }
  function safeUrl(u) { return /^(https?:|mailto:|[\w./#?=&%-]+$)/i.test(u) ? u : '#'; }
  // text with [label](url) links, **bold** and *italic*; everything else is escaped
  function inline(t) {
    var out = '', re = /\[([^\]]+)\]\(([^)\s]+)\)/g, last = 0, m;
    function fmt(x) { return esc(x).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>').replace(/\*(.+?)\*/g, '<em>$1</em>'); }
    while ((m = re.exec(t))) { out += fmt(t.slice(last, m.index)) + '<a href="' + esc(safeUrl(m[2])) + '">' + esc(m[1]) + '</a>'; last = re.lastIndex; }
    return out + fmt(t.slice(last));
  }
  function block(b) {
    if (typeof b === 'string') return '<p>' + inline(b) + '</p>';
    if (b.img) return '<figure><img src="' + esc(safeUrl(b.img)) + '" alt="' + esc(b.alt || '') + '" loading="lazy">' + (b.caption ? '<figcaption>' + inline(b.caption) + '</figcaption>' : '') + '</figure>';
    if (b.heading) return '<h3>' + esc(b.heading) + '</h3>';
    if (b.list) return '<ul>' + b.list.map(function (i) { return '<li>' + inline(i) + '</li>'; }).join('') + '</ul>';
    return '';
  }
  function plain(p) { return (p.title + ' ' + p.body.map(function (b) { return typeof b === 'string' ? b : (b.caption || b.heading || (b.list || []).join(' ')); }).join(' ')).toLowerCase(); }
  function render() {
    var term = bq.value.trim().toLowerCase(), shown = posts.filter(function (p) { return !term || plain(p).indexOf(term) > -1; });
    box.innerHTML = shown.length ? shown.map(function (p) {
      return '<article class="post" id="' + esc(p.id) + '"><p class="pdate">' + esc(p.date) + '</p><h2><a href="#' + esc(p.id) + '">' + esc(p.title) + '</a></h2>' + p.body.map(block).join('') + '</article>';
    }).join('') : '<p class="empty">' + (posts.length ? 'No post matches your search.' : 'No posts yet.') + '</p>';
    if (location.hash && !term) { var el = document.getElementById(decodeURIComponent(location.hash.slice(1))); if (el) el.scrollIntoView(); }
  }
  fetch('posts.json', { cache: 'no-cache' }).then(function (r) { if (!r.ok) throw 0; return r.json(); }).then(function (d) {
    posts = (d.posts || []).slice().sort(function (a, b) { return a.date < b.date ? 1 : a.date > b.date ? -1 : 0; });
    render();
  }).catch(function () { box.innerHTML = '<p class="empty">The posts could not be loaded. Open <a href="posts.json">posts.json</a> directly.</p>'; });
  bq.addEventListener('input', render);
})();
</script>
<script src="site.js"></script>
